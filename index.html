    <script>
      // Suppression précoce et définitive des rejections et erreurs WebSocket liées à l'HMR de Vite
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason) {
          const reasonStr = event.reason.message || event.reason.toString() || '';
          if (reasonStr.includes('WebSocket') || reasonStr.includes('websocket')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);

      window.addEventListener('error', function (event) {
        if (event.message) {
          if (event.message.includes('WebSocket') || event.message.includes('websocket')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);
    </script>
